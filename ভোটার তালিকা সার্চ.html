<html lang="bn">
<head>
<meta charset="utf-8">

<title>ভোটার তালিকা সার্চ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e3e6ea;--ac:#0f766e;--acbg:#e6f4f2;--hl:#fde68a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161a;--card:#1b2127;--tx:#e8ebee;--mu:#9aa4af;--bd:#2c353d;--ac:#2dd4bf;--acbg:#12312f;--hl:#6b5a14}}
:root[data-theme="dark"]{--bg:#12161a;--card:#1b2127;--tx:#e8ebee;--mu:#9aa4af;--bd:#2c353d;--ac:#2dd4bf;--acbg:#12312f;--hl:#6b5a14}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:4px 0 12px;font-weight:600}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0}
.search{display:flex;gap:8px;flex-wrap:wrap}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;min-width:0}
input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
#q{flex:1 1 260px;font-size:1.05rem}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;color:var(--mu);font-size:.9rem}
.chip{background:var(--acbg);color:var(--ac);padding:3px 10px;border-radius:99px;font-weight:500}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:880px;font-size:.95rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:top}
th{position:sticky;top:0;background:var(--card);color:var(--mu);font-weight:500;font-size:.82rem;white-space:nowrap;cursor:pointer;user-select:none}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--acbg)}
td.n{font-weight:500}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:40px;text-align:center;color:var(--mu)}
.hint{color:var(--mu);font-size:.82rem;margin-top:10px}
</style>
</head>

<div class="wrap">
<h1>ভোটার তালিকা সার্চ</h1>
<div class="bar"><div class="search">
<input id="q" type="search" placeholder="নাম, পিতা/মাতার নাম, ভোটার নং, বাড়ি, ঠিকানা লিখে খুঁজুন…" autofocus autocomplete="off">
<select id="occ"><option value="">সব পেশা</option></select>
<select id="area"><option value="">সব এলাকা</option></select>
</div></div>
<div class="meta"><span class="chip" id="cnt"></span><span id="tot"></span></div>
<div class="tw"><table><thead><tr>

</div>

const BN="০১২৩৪৫৬৭৮৯";
function norm(s){return String(s||"").replace(/[০-৯]/g,c=>BN.indexOf(c)).replace(/ী/g,"ি").replace(/ূ/g,"ু").replace(/ষ্ট/g,"স্ট").replace(/ড়/g,"ড়").replace(/য়/g,"য়").replace(/\s+/g," ").toLowerCase().trim()}
const toBn=s=>String(s).replace(/\d/g,d=>BN[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D=RAW.map(r=>({s:r[0],n:r[1],v:r[2],f:r[3],m:r[4],o:r[5],d:r[6],h:r[7],a:r[8],area:r[9]}));
D.forEach(r=>r.key=norm([r.n,r.v,r.f,r.m,r.o,r.h,r.a,r.d].join(" ")));
const $=id=>document.getElementById(id);
[...new Set(D.map(r=>r.o))].sort().forEach(o=>$("occ").add(new Option(o,o)));
[...new Set(D.map(r=>r.area))].sort().forEach(o=>$("area").add(new Option(o,o)));
let sk="s",sd=1;
function hl(text,terms){let t=esc(text);if(!terms.length)return t;
 // highlight on raw text where the raw substring matches a term (simple)
 terms.forEach(w=>{if(!w)return;const re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");t=t.replace(re,"<mark>$1</mark>")});return t}
function render(){
 const raw=$("q").value, terms=norm(raw).split(" ").filter(Boolean), oc=$("occ").value, ar=$("area").value;
 let rows=D.filter(r=>(!oc||r.o===oc)&&(!ar||r.area===ar)&&terms.every(t=>r.key.includes(t)));
 rows.sort((a,b)=>{const x=a[sk],y=b[sk];return (sk==="s"?x-y:String(x).localeCompare(String(y),"bn"))*sd});
 const rawTerms=raw.trim().split(/\s+/).filter(Boolean);
 $("tb").innerHTML=rows.map(r=>`<tr><td class="num">${toBn(r.s)}</td><td class="n">${hl(r.n,rawTerms)}</td><td class="num">${hl(r.v,rawTerms)}</td><td>${hl(r.f,rawTerms)}</td><td>${hl(r.m,rawTerms)}</td><td>${esc(r.o)}</td><td class="num">${toBn(r.d.split("-").reverse().join("/"))}</td><td>${hl(r.h,rawTerms)}</td><td>${hl(r.a,rawTerms)}</td></tr>`).join("");
 $("em").hidden=rows.length>0;
 $("cnt").textContent=toBn(rows.length)+" জন পাওয়া গেছে";
 $("tot").textContent="মোট "+toBn(D.length)+" জন";
}
$("q").addEventListener("input",render);$("occ").addEventListener("change",render);$("area").addEventListener("change",render);
document.querySelectorAll("th").forEach(th=>th.addEventListener("click",()=>{const k=th.dataset.k;sd=(sk===k)?-sd:1;sk=k;render()}));
render();
</script>
